  .scene .porte-svg .panneau { transition: filter .25s; }
  .scene .porte-svg.eclaire .panneau { filter: brightness(1.18) drop-shadow(0 0 6px var(--lueur)); }

  /*
    ORDINATEUR (27-09-2026, retour d'Erwan : « la version mobile est bien,
    sur PC il faut la réadapter »). La colonne de téléphone restait perdue

  */

    .page { max-width: 1560px; min-height: 100dvh; padding: 40px 56px; gap: 0 72px;

    .scene { grid-area: scene; align-self: center; width: min(100%, calc((100dvh - 80px) * 360 / 340)); justify-self: center; }

<script>
  /* Géométrie isométrique : sol en losange, deux murs sur les arêtes du fond. */
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('svg');
  const el = (tag, attrs, parent = svg) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.append(e); return e; };
  const pts = (a) => a.map((p) => p.join(',')).join(' ');
  const G = { x: 30, y: 250 }, H = { x: 180, y: 175 }, D = { x: 330, y: 250 }, B = { x: 180, y: 325 }, MUR = 130;
  const surG = (t) => [G.x + (H.x - G.x) * t, G.y + (H.y - G.y) * t];   // arête gauche
  const surD = (t) => [H.x + (D.x - H.x) * t, H.y + (D.y - H.y) * t];   // arête droite
  const haut = ([x, y], h = MUR) => [x, y - h];

  // murs
  el('polygon', { points: pts([[G.x, G.y], [H.x, H.y], haut([H.x, H.y]), haut([G.x, G.y])]), fill: '#2b3a5c' });
  el('polygon', { points: pts([[H.x, H.y], [D.x, D.y], haut([D.x, D.y]), haut([H.x, H.y])]), fill: '#22304d' });
  el('polyline', { points: pts([haut([G.x, G.y]), haut([H.x, H.y]), haut([D.x, D.y])]), fill: 'none', stroke: '#0a0f1c', 'stroke-width': 3 });
  // plinthe
  el('polygon', { points: pts([[G.x, G.y], [H.x, H.y], haut([H.x, H.y], 8), haut([G.x, G.y], 8)]), fill: '#1b2640' });
  el('polygon', { points: pts([[H.x, H.y], [D.x, D.y], haut([D.x, D.y], 8), haut([H.x, H.y], 8)]), fill: '#162036' });
  // sol en damier
  el('polygon', { points: pts([[G.x, G.y], [H.x, H.y], [D.x, D.y], [B.x, B.y]]), fill: '#d8c9a3', stroke: '#8f8160', 'stroke-width': 2 });
  const N = 6;
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
    if ((i + j) % 2) continue;
    const c = (u, v) => [H.x + (D.x - H.x) * u / N + (G.x - H.x) * v / N, H.y + (D.y - H.y) * u / N + (G.y - H.y) * v / N];
    el('polygon', { points: pts([c(i, j), c(i + 1, j), c(i + 1, j + 1), c(i, j + 1)]), fill: '#cdbd95' });
  }

  /* les portes : [arête, t0, t1, couleur, lumière, domaine] */
  const PORTES = [
    { arete: surG, t0: .40, t1: .60, c: '#3b82f6', c2: '#1d4fb8', lum: '#cfe0ff', dom: '.com', url: 'https://kodaprod.com', dit: 'Faites comme chez vous.', dir: 6 },
    { arete: surD, t0: .16, t1: .36, c: '#e27da0', c2: '#a8466b', lum: '#ffe3ee', dom: '.live', url: 'https://kodaprod.live', dit: 'Félicitations, au fait !', dir: 0 },
    { arete: surD, t0: .60, t1: .80, c: '#3fbf95', c2: '#1f7d5f', lum: '#dcfff2', dom: '.online', url: 'https://kodaprod.online', dit: 'On parle de votre marque ?', dir: 0 },
  ];
  const HP = 84;
  PORTES.forEach((p, k) => {
    const a = p.arete(p.t0), b = p.arete(p.t1);
    const g = el('g', { class: 'porte-svg', 'data-k': k, style: `--lueur:${p.c}` });
    p.g = g;
    // chambranle
    el('polygon', { points: pts([[a[0] - 3, a[1] + 1.5], [b[0] + 3, b[1] + (b[1] > a[1] ? 1.5 : -1.5)], haut(b, HP + 6), haut(a, HP + 6)]), fill: '#111', }, g);
    // la lumière derrière
    el('polygon', { points: pts([a, b, haut(b, HP), haut(a, HP)]), fill: p.lum }, g);
    // le battant (se replie à l'ouverture)
    p.panneau = el('polygon', { class: 'panneau', points: pts([a, b, haut(b, HP), haut(a, HP)]), fill: p.c, stroke: '#000', 'stroke-width': 1.5 }, g);
    p.a = a; p.b = b;
    // la plaque, couchée sur le mur
    const m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2 - HP - 14];
    const pente = (b[1] - a[1]) / (b[0] - a[0]);
    const plaque = el('g', { transform: `matrix(1 ${pente} 0 1 ${m[0]} ${m[1]})` }, g);
    el('rect', { class: 'plaque-fond', x: -22, y: -9, width: 44, height: 14, fill: '#16161c', stroke: '#000', 'stroke-width': 1.5 }, plaque);
    el('text', { x: 0, y: 2, 'text-anchor': 'middle', 'font-family': 'JetBrains Mono', 'font-size': 9, fill: '#fff' }, plaque).textContent = p.dom;
    g.addEventListener('click', () => aller(k));
  });

  /* Koda : au centre du sol, il marche jusqu'à la porte choisie */
  const scene = document.getElementById('scene'), koda = document.getElementById('koda'), img = document.getElementById('kodaImg');
  let pos = [185, 262];
  const placer = ([x, y]) => { koda.style.left = (x / 360 * 100) + '%'; koda.style.top = (y / 340 * 100) + '%'; };
  placer(pos);
  let occupe = false;
  const aller = (k) => {
    if (occupe) return; occupe = true;
    const p = PORTES[k];
    const mil = [(p.a[0] + p.b[0]) / 2, (p.a[1] + p.b[1]) / 2];
    // un pas devant la porte, dans la pièce
    const cible = [mil[0] + (p.arete === surG ? 22 : -22), mil[1] + 16];
    const depart = pos.slice(), t0 = performance.now(), duree = 900;
    Koda.taper(document.getElementById('bulle'), p.dit, 26);
    const pas = (t) => {
      const u = Math.min(1, (t - t0) / duree);
      pos = [depart[0] + (cible[0] - depart[0]) * u, depart[1] + (cible[1] - depart[1]) * u];
      placer(pos);
      img.src = `/img/koda/hb_or_marche_${p.dir}_${Math.floor((t - t0) / 110) % 4}.png`;
      if (u < 1) return requestAnimationFrame(pas);
      img.src = `/img/koda/hb_or_debout_${p.dir}_0.png`;
      ouvrir(p);
    };
    requestAnimationFrame(pas);
  };
  const ouvrir = (p) => {
    const t0 = performance.now();
    const anim = (t) => {
      const u = Math.min(1, (t - t0) / 500), l = 1 - .82 * u;   // le battant se replie sur son gond
      const b2 = [p.a[0] + (p.b[0] - p.a[0]) * l, p.a[1] + (p.b[1] - p.a[1]) * l];
      p.panneau.setAttribute('points', pts([p.a, b2, haut(b2, HP), haut(p.a, HP)]));
      if (u < 1) return requestAnimationFrame(anim);
      Koda.partir(p.url, `https://<b>kodaprod${p.dom}</b>`);
      p.fermer = () => { p.panneau.setAttribute('points', pts([p.a, p.b, haut(p.b, HP), haut(p.a, HP)])); };
    };
    requestAnimationFrame(anim);
  };
  /* Shift Tabs (Animata, les onglets de kodaprod.com) : l'onglet touché se marque,
     puis Koda marche jusqu'à la porte, ou le lien part. */
  const domaines = [...document.querySelectorAll('.shift-domaines a')];
  domaines.forEach((a) => a.addEventListener('click', (e) => {
    e.preventDefault();
    domaines.forEach((x) => x.classList.toggle('choisi', x === a));
    setTimeout(() => aller(+a.dataset.porte), 180);
  }));
  // À la souris : le bouton éclaire sa porte et tourne Koda vers elle ; la porte marque son bouton.
  if (matchMedia('(hover: hover) and (pointer: fine)').matches) {
    /*
      Koda REGARDE la porte, il ne lui tourne pas le dos : profil gauche (5)
      pour .com, profil droit (1) pour .live et .online. Il pivote cran par
      cran (8 orientations Habbo, 80 ms le cran) par le chemin le plus court,
      en passant par la face, et revient à sa pose de repos (4). Retour
      d'Erwan du 28-09 : la bascule d'un coup sur une vue de dos ne marchait pas.
    */
    const REGARD = [5, 1, 1], REPOS_DIR = 4;
    let pivot = 0;
    // l'orientation se lit sur l'image : après une marche ou un retour arrière, elle reste juste
    const dirAffichee = () => { const m = img.src.match(/debout_(\d)_0/); return m ? +m[1] : REPOS_DIR; };
    const tourner = (cible) => {
      clearTimeout(pivot);
      const cran = () => {
        const d = dirAffichee();
        if (occupe || d === cible) return;
        const suivante = (d + ((cible - d + 8) % 8 <= 4 ? 1 : 7)) % 8;
        img.src = `/img/koda/hb_or_debout_${suivante}_0.png`;
        pivot = setTimeout(cran, 80);
      };
      cran();
    };
    const designer = (k) => {
      PORTES.forEach((p, i) => p.g.classList.toggle('eclaire', i === k));
      domaines.forEach((a, i) => a.classList.toggle('survol', i === k));
      tourner(k === null ? REPOS_DIR : REGARD[k]);
    };
    domaines.forEach((a, k) => { a.addEventListener('mouseenter', () => designer(k)); a.addEventListener('mouseleave', () => designer(null)); });
    PORTES.forEach((p, k) => { p.g.addEventListener('mouseenter', () => designer(k)); p.g.addEventListener('mouseleave', () => designer(null)); });
  }
  document.querySelectorAll('.shift-place a').forEach((a) => a.addEventListener('click', (e) => {
    a.classList.add('choisi');
    setTimeout(() => a.classList.remove('choisi'), 1400);
    if (a.target === '_blank') return;          // l'onglet neuf s'ouvre tout seul
    e.preventDefault();
    setTimeout(() => (location.href = a.href), 300);
  }));
  Koda.taper(document.getElementById('bulle'), 'Touchez une porte, je vous y emmène.');
  // Retour arrière depuis un des sites : la page revient du cache telle qu'on l'a quittée,
  // porte ouverte et Koda devant. On remet la pièce en ordre.
  addEventListener('pageshow', (e) => {
    if (!e.persisted) return;
    PORTES.forEach((p) => p.fermer?.());
    pos = [185, 262]; placer(pos); img.src = '/img/koda/hb_or_debout_4_0.png'; occupe = false;
    document.querySelector('.redirection')?.classList.remove('visible');
    document.querySelectorAll('.shift .choisi').forEach((x) => x.classList.remove('choisi'));
    Koda.taper(document.getElementById('bulle'), 'Re-bonjour ! Une autre porte ?');
  });
</script>
